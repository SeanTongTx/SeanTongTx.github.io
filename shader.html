<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图形渲染 - 童潇</title>
<link rel="stylesheet" href="Resources/style.css">
<style>
.masonry { column-count: 2; column-gap: 14px; }
@media (max-width: 600px) { .masonry { column-count: 1; } }

.section-block {
  break-inside: avoid;
  background: #fff;
  border-radius: 10px;
  border: 1px solid #edf2f7;
  margin-bottom: 14px;
  overflow: hidden;
}
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background .2s;
}
.section-header:hover { background: #f7fafc; }
.section-header h3 {
  font-size: 14px; font-weight: 600; color: #1a202c;
  margin: 0; display: flex; align-items: center; gap: 8px;
}
.section-header .badge {
  font-size: 11px; font-weight: 500; color: #a0aec0;
  background: #edf2f7; padding: 1px 8px; border-radius: 8px;
}
.section-header .arrow {
  font-size: 12px; color: #a0aec0; transition: transform .25s;
}
.section-block.collapsed .arrow { transform: rotate(-90deg); }
.section-body { padding: 0 14px 14px; }
.section-block.collapsed .section-body { display: none; }
.next-btn {
  display: block; width: 100%; margin-top: 12px;
  padding: 8px 0; border: none; border-radius: 6px;
  background: #edf2f7; color: #4a5568;
  font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s;
}
.next-btn:hover { background: #2b6cb0; color: #fff; }

.media-list { display: flex; flex-direction: column; gap: 10px; }
.media-thumb {
  flex-shrink: 1;
  border-radius: 6px; overflow: hidden;
  position: relative;
}
.media-thumb img, .media-thumb video {
  width: 100%; max-width: 768px; display: block;
}
.media-thumb .play-overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 1;
  background: rgba(0,0,0,.15);
  transition: opacity .2s;
}
.media-thumb .play-overlay:hover { background: rgba(0,0,0,.25); }
.media-thumb .play-overlay .play-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(0,0,0,.55); display: flex;
  align-items: center; justify-content: center;
}
.media-thumb .play-overlay .play-icon::after {
  content: ""; display: block;
  border: 11px solid transparent;
  border-left: 18px solid #fff;
  margin-left: 4px;
}
.media-thumb .poster-img { width: 100%; max-width: 768px; display: block; }
.media-caption {
  font-size: 13px; color: #4a5568; line-height: 1.6;
}
.media-pair {
  display: flex; gap: 10px;
}
.media-pair .media-item { flex: 1; min-width: 0; }
.media-pair .media-thumb { max-width: none; }
.media-pair .media-caption { font-size: 12px; }
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 9999; cursor: zoom-out;
  justify-content: center; align-items: center;
  padding: 20px;
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 90vw; max-height: 90vh;
  border-radius: 6px; object-fit: contain;
}
@media (max-width: 600px) {
  .media-item { flex-direction: column; align-items: stretch; }
  .media-thumb { width: 100%; }
}
</style>
</head>
<body>
<div class="bg-back"></div>

<div style="text-align:center;padding:20px 0 40px;"><a href="index.html" style="color:#2b6cb0;text-decoration:none;font-size:14px;font-weight:500;">&larr; 返回简历</a></div>
<div class="lightbox" id="lightbox"><img id="lightbox-img"></div>
<script>

    files: [

    ]

  {

    files: [
      { name: "卡通各向异性.mp4", type: "video" },

    ]
  }
];

var base = "Resources/图形渲染/";
var dirMap = {
  "场景渲染（AHD Lighting）": "场景渲染(AHDLighting)",
  "地形渲染": "地形渲染",
  "特效": "特效",
  "贴花": "贴花",
  "渲染管线增强": "渲染管线增强",
  "运行时卡牌图集": "运行时卡牌图集",
  "HD2D": "HD2D",
  "InteractiveWorld": "InteractiveWorld",
  "PBR": "PBR",
  "UE5 相关": "UE5相关"
};
var container = document.getElementById("sections");

sections.forEach(function(sec) {
  var block = document.createElement("div");
  block.className = "section-block";

  var header = document.createElement("div");
  header.className = "section-header";
  header.innerHTML = '<h3>' + sec.title + '<span class="badge">' + sec.files.length + '</span></h3><span class="arrow">&#9660;</span>';
  header.onclick = function() { block.classList.toggle("collapsed"); };

  var body = document.createElement("div");
  body.className = "section-body";

    var grid = document.createElement("div");
  grid.className = "media-list";

  var dirName = sec.root ? "" : (dirMap[sec.title] || sec.title);

  var i = 0;
  while (i < sec.files.length) {
    var f = sec.files[i];
    var path = base + (dirName ? dirName + "/" : "") + f.name;

    if (f.pair && sec.files[i + 1] && sec.files[i + 1].pair) {
      var pairDiv = document.createElement("div");
      pairDiv.className = "media-pair";
      for (var j = 0; j < 2; j++) {
        var pf = sec.files[i + j];
        var ppath = base + (dirName ? dirName + "/" : "") + pf.name;
        var pitem = document.createElement("div");
        pitem.className = "media-item";
        pitem.innerHTML = '<div class="media-thumb"><img src="' + ppath + '" loading="lazy" onclick="openLightbox(this.src)" style="cursor:zoom-in"></div><div class="media-caption">' + (pf.caption || pf.name) + '</div>';
        pairDiv.appendChild(pitem);
      }
      grid.appendChild(pairDiv);
      i += 2;
    } else {
      var item = document.createElement("div");
      var thumb = '<div class="media-thumb">';
      if (f.type === "img") {
        thumb += '<img src="' + path + '" loading="lazy" onclick="openLightbox(this.src)" style="cursor:zoom-in">';
      } else {
        var videoSrc = f.src || path;
      var fallback = f.src ? ' data-fallback="' + path + '" onerror="if(this.src!==this.dataset.fallback){this.src=this.dataset.fallback}"' : '';
      thumb += '<video src="' + videoSrc + '" preload="metadata" muted playsinline' + fallback + '></video>';
        thumb += '<div class="play-overlay"><div class="play-icon"></div></div>';
      }
      thumb += '</div>';
      var label = (f.caption || f.name).replace(/\.[^.]+$/, "");
      item.innerHTML = thumb + '<div class="media-caption">' + label + '</div>';
      grid.appendChild(item);
      i++;
    }
  }

  body.appendChild(grid);
  block.appendChild(header);
  block.appendChild(body);
  container.appendChild(block);
});

var blocks = container.querySelectorAll(".section-block");
blocks.forEach(function(b, i) {
  if (i < blocks.length - 1) {
    var btn = document.createElement("button");
    btn.className = "next-btn";
    btn.textContent = "下一个 ▼";
    btn.onclick = function() {
      b.classList.add("collapsed");
      blocks[i + 1].classList.remove("collapsed");
      blocks[i + 1].scrollIntoView({ behavior: "smooth", block: "start" });
    };
    b.querySelector(".section-body").appendChild(btn);
  }
});

blocks.forEach(function(b, i) {
  if (i > 0) b.classList.add("collapsed");
});

var lightbox = document.getElementById("lightbox");
var lightboxImg = document.getElementById("lightbox-img");
function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add("active"); }
lightbox.onclick = function() { lightbox.classList.remove("active"); lightboxImg.src = ""; };

document.querySelectorAll(".media-thumb img").forEach(function(img) {
  img.addEventListener("load", function() {
    if (img.naturalWidth) img.style.maxWidth = img.naturalWidth + "px";
  });
  if (img.complete && img.naturalWidth) img.style.maxWidth = img.naturalWidth + "px";
});

document.querySelectorAll(".media-thumb video").forEach(function(v) {
  var thumb = v.parentElement;
  var overlay = thumb.querySelector(".play-overlay");
  var playing = false;

  overlay.addEventListener("click", function() {
    overlay.style.display = "none";
    v.controls = true;
    v.play();
    playing = true;
  });

  v.addEventListener("click", function() {
    if (!playing) return;
    v.pause();
    playing = false;
  });

  v.addEventListener("pause", function() {
    if (playing) return;
    v.controls = false;
    overlay.style.display = "";
    v.load();
  });

  v.addEventListener("ended", function() {
    playing = false;
    v.controls = false;
    overlay.style.display = "";
    v.load();
  });
});

(function(){
  var fallbackMap = {
    "https://i0.hdslb.com/bfs/openplatform/383b7fabb4ad3fee2b58ef94c7e082d6bedae80d.png@1e_1c.webp": "Resources/back.png"
  };
  var bgSrc = getComputedStyle(document.querySelector(".bg-back")).backgroundImage.match(/url\("?([^"]+)"?\)/);
  if(bgSrc && fallbackMap[bgSrc[1]]){
    var bgImg = new Image();
    bgImg.onerror = function(){
      document.querySelector(".bg-back").style.backgroundImage = 'url(' + fallbackMap[bgSrc[1]] + ')';
    };
    bgImg.src = bgSrc[1];
  }
})();
</script>
</body>
</html>
