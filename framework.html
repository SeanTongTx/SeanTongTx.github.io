<style>
.masonry { display: flex; flex-direction: column; gap: 14px; }

.section-block {
  break-inside: avoid;
  background: #fff;
  border-radius: 10px;
  border: 1px solid #edf2f7;
  margin-bottom: 14px;
  overflow: hidden;
}
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background .2s;
}
.section-header:hover { background: #f7fafc; }
.section-header h3 {
  font-size: 14px; font-weight: 600; color: #1a202c;
  margin: 0; display: flex; align-items: center; gap: 8px;
}
.section-header .badge {
  font-size: 11px; font-weight: 500; color: #a0aec0;
  background: #edf2f7; padding: 1px 8px; border-radius: 8px;
}
.section-header .arrow {
  font-size: 12px; color: #a0aec0; transition: transform .25s;
}
.section-block.collapsed .arrow { transform: rotate(-90deg); }
.section-body { padding: 0 14px 14px; }
.section-block.collapsed .section-body { display: none; }
.next-btn {
  display: block; width: 100%; margin-top: 12px;
  padding: 8px 0; border: none; border-radius: 6px;
  background: #edf2f7; color: #4a5568;
  font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s;
}
.next-btn:hover { background: #2b6cb0; color: #fff; }

.media-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.media-thumb {
  flex: 1 1 300px;
  max-width: 400px;
  border-radius: 6px; overflow: hidden;
  position: relative;
}
.media-thumb img, .media-thumb video {
  width: 100%; max-width: 768px; display: block;
}
.media-thumb .play-overlay {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 1;
  background: rgba(0,0,0,.15);
  transition: opacity .2s;
}
.media-thumb .play-overlay:hover { background: rgba(0,0,0,.25); }
.media-thumb .play-overlay .play-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(0,0,0,.55); display: flex;
  align-items: center; justify-content: center;
}
.media-thumb .play-overlay .play-icon::after {
  content: ""; display: block;
  border: 11px solid transparent;
  border-left: 18px solid #fff;
  margin-left: 4px;
}
.media-thumb .poster-img { width: 100%; max-width: 768px; display: block; }
.media-caption {
  font-size: 13px; color: #4a5568; line-height: 1.6;
}
.media-pair {
  display: flex; gap: 10px;
}
.media-pair .media-item { flex: 1; min-width: 0; }
.media-pair .media-thumb { max-width: none; }
.media-pair .media-caption { font-size: 12px; }
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 9999; cursor: zoom-out;
  justify-content: center; align-items: center;
  padding: 20px;
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 90vw; max-height: 90vh;
  border-radius: 6px; object-fit: contain;
}
@media (max-width: 600px) {
  .media-item { flex-direction: column; align-items: stretch; }
  .media-thumb { width: 100%; }
}

/* 架构图样式 */
.arch-diagram {
  background: linear-gradient(135deg, #f7fafc, #edf2f7);
  border-radius: 10px;
  padding: 24px;
  margin: 16px 0;
  border: 1px solid #e2e8f0;
}
.arch-row {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.arch-row:last-child { margin-bottom: 0; }
.arch-box {
  flex: 1;
  min-width: 120px;
  background: #fff;
  border-radius: 8px;
  padding: 12px 16px;
  text-align: center;
  border: 1px solid #e2e8f0;
  font-size: 13px;
  font-weight: 500;
  color: #4a5568;
  transition: all .2s;
}
.arch-box:hover {
  border-color: #2b6cb0;
  box-shadow: 0 2px 8px rgba(43,108,176,.1);
}
.arch-box.primary {
  background: #2b6cb0;
  color: #fff;
  border-color: #2b6cb0;
}
.arch-box.secondary {
  background: #ebf4ff;
  color: #2b6cb0;
  border-color: #bee3f8;
}
.arch-label {
  font-size: 11px;
  color: #a0aec0;
  margin-bottom: 4px;
}
.arch-arrow {
  text-align: center;
  color: #a0aec0;
  font-size: 18px;
  margin: 8px 0;
}

/* 代码块样式 */
.code-block {
  background: #1a202c;
  border-radius: 8px;
  padding: 16px 20px;
  margin: 12px 0;
  overflow-x: auto;
  font-family: "Fira Code", "SF Mono", monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #e2e8f0;
}
.code-block .comment { color: #718096; }
.code-block .keyword { color: #63b3ed; }
.code-block .string { color: #68d391; }
.code-block .class { color: #f6ad55; }

/* 插件卡片 */
.plugin-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 6px;
  margin: 12px 0;
}
.plugin-card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 8px;
  background: #f7fafc;
  border-radius: 6px;
  padding: 10px 12px;
  border: 1px solid #e2e8f0;
  transition: all .2s;
}
.plugin-card:hover {
  border-color: #2b6cb0;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(43,108,176,.1);
}
.plugin-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, #ebf4ff, #d6e4ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.plugin-name {
  font-weight: 600;
  font-size: 13px;
  color: #1a202c;
  align-self: center;
}
.plugin-desc {
  grid-column: 1 / -1;
  font-size: 11px;
  color: #718096;
  line-height: 1.5;
  word-break: break-word;
}
</style>

    { icon: "🖼️", name: "渲染资源管理器", desc: "材质、贴图、Shader 资源统一管理" },
    { icon: "📐", name: "数学库", desc: "向量、矩阵、插值等常用数学工具" }
  ];

  var html = '<div style="margin-bottom:16px;padding:16px;background:#f7fafc;border-radius:10px;border:1px solid #edf2f7;">' +
    '<div style="font-size:13px;color:#4a5568;line-height:1.8;">程序框架使用选择构建模式搭建，多种低耦合功能插件+插件扩展，应对不同项目需求选择对应的功能包。既可以构建自己的底层框架。</div>' +
  '</div>';

  html += '<div class="plugin-grid">';
  plugins.forEach(function(p) {
    html += '<div class="plugin-card">' +
      '<div class="plugin-icon">' + p.icon + '</div>' +
      '<div class="plugin-name">' + p.name + '</div>' +
      '<div class="plugin-desc">' + p.desc + '</div>' +
    '</div>';
  });
  html += '</div>';

  return html;
}

sections.forEach(function(sec) {
  var block = document.createElement("div");
  block.className = "section-block";

  var header = document.createElement("div");
  header.className = "section-header";

  var badge = "";
  if (sec.files) {
    badge = '<span class="badge">' + sec.files.length + '</span>';
  }

  header.innerHTML = '<h3>' + sec.title + badge + '</h3><span class="arrow">&#9660;</span>';
  header.onclick = function() { block.classList.toggle("collapsed"); };

  var body = document.createElement("div");
  body.className = "section-body";

  if (sec.content === "arch") {
    body.innerHTML = createArchDiagram();
  } else if (sec.content === "plugins") {
    body.innerHTML = createPluginContent();
  } else if (sec.files) {
    var grid = document.createElement("div");
    grid.className = "media-list";

    if (sec.desc) {
      var descDiv = document.createElement("div");
      descDiv.style.cssText = "width:100%;margin-bottom:12px;padding:14px 16px;background:#f7fafc;border-radius:8px;border:1px solid #edf2f7;";
      descDiv.innerHTML = '<div style="font-size:13px;color:#4a5568;line-height:1.8;">' + sec.desc + '</div>';
      grid.appendChild(descDiv);
    }

    sec.files.forEach(function(f) {
      var basePath = sec.base || base;
      var path = basePath + f.name;
      var item = document.createElement("div");
      var thumb = '<div class="media-thumb">';
      if (f.type === "img") {
        thumb += '<img src="' + (f.cdn || cdnBase + encodeURIComponent(path.replace("Resources/",""))) + '" loading="lazy" onclick="openLightbox(this.src)" style="cursor:zoom-in" data-fallback="' + path + '">';
      } else {
        thumb += '<video src="' + (f.cdn || cdnBase + encodeURIComponent(path.replace("Resources/",""))) + '" preload="metadata" muted playsinline data-fallback="' + path + '"></video>';
        thumb += '<div class="play-overlay"><div class="play-icon"></div></div>';
      }
      thumb += '</div>';
      var label = f.caption || f.name.replace(/\.[^.]+$/, "");
      item.innerHTML = thumb + '<div class="media-caption">' + label + '</div>';
      grid.appendChild(item);
    });

    body.appendChild(grid);
  }

  block.appendChild(header);
  block.appendChild(body);
  container.appendChild(block);
});

var blocks = container.querySelectorAll(".section-block");
blocks.forEach(function(b, i) {
  if (i < blocks.length - 1) {
    var btn = document.createElement("button");
    btn.className = "next-btn";
    btn.textContent = "下一个 ▼";
    btn.onclick = function() {
      b.classList.add("collapsed");
      blocks[i + 1].classList.remove("collapsed");
      blocks[i + 1].scrollIntoView({ behavior: "smooth", block: "start" });
    };
    b.querySelector(".section-body").appendChild(btn);
  }
});

blocks.forEach(function(b, i) {
  if (i > 0) b.classList.add("collapsed");
});

var lightbox = document.getElementById("lightbox");
var lightboxImg = document.getElementById("lightbox-img");
function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add("active"); }
lightbox.onclick = function() { lightbox.classList.remove("active"); lightboxImg.src = ""; };

document.querySelectorAll(".media-thumb img").forEach(function(img) {
  img.addEventListener("load", function() {
    if (img.naturalWidth) img.style.maxWidth = img.naturalWidth + "px";
  });
  if (img.complete && img.naturalWidth) img.style.maxWidth = img.naturalWidth + "px";
});

document.querySelectorAll(".media-thumb video").forEach(function(v) {
  var thumb = v.parentElement;
  var overlay = thumb.querySelector(".play-overlay");
  var playing = false;

  overlay.addEventListener("click", function() {
    overlay.style.display = "none";
    v.controls = true;
    v.play();
    playing = true;
  });

  v.addEventListener("click", function() {
    if (!playing) return;
    v.pause();
    playing = false;
  });

  v.addEventListener("pause", function() {
    if (playing) return;
    v.controls = false;
    overlay.style.display = "";
    v.load();
  });

  v.addEventListener("ended", function() {
    playing = false;
    v.controls = false;
    overlay.style.display = "";
    v.load();
  });
});


</script>
</body>
</html>
